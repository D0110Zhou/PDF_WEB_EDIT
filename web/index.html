<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>PDF 表格編輯器 - 向量渲染原型</title>
    <link rel="stylesheet" href="./src/ui/styles/app.css" />
  </head>
  <body>
    <header class="toolbar">
      <input type="file" id="fileInput" accept="application/pdf,.pdf" aria-label="選擇 PDF" />
      <label class="toolbar-control">頁碼範圍
        <input type="text" id="pageRange" value="1" aria-label="頁碼範圍" />
      </label>
      <button id="loadPagesBtn" type="button">載入頁面</button>
      <label class="toolbar-control">目前頁
        <select id="pageSelect" aria-label="目前頁面" disabled></select>
      </label>
      <button id="roiModeBtn" type="button" aria-pressed="false">框選表格</button>
      <button id="saveProjectBtn" type="button">儲存 JSON</button>
      <label class="toolbar-control file-button">載入 JSON
        <input type="file" id="projectInput" accept="application/json,.json" />
      </label>
      <label class="toolbar-control file-button">嵌入 Calibri
        <input type="file" id="latinFontInput" accept=".ttf,.otf,application/font-sfnt" />
      </label>
      <label class="toolbar-control file-button">嵌入標楷體
        <input type="file" id="cjkFontInput" accept=".ttf,.otf,application/font-sfnt" />
      </label>
      <button id="exportPdfBtn" type="button">匯出 PDF</button>
      <label class="toolbar-control">縮放
        <input type="range" id="zoomSlider" min="0.1" max="64" step="0.1" value="1" />
        <span class="zoom-value" id="zoomLabel">100%</span>
      </label>
      <label class="toolbar-control">後端
        <select id="backendSelect" aria-label="渲染後端">
          <option value="auto">自動</option>
          <option value="pdfjs">PDF.js 完整頁面</option>
          <option value="webgpu">WebGPU</option>
          <option value="webgl">WebGL</option>
        </select>
      </label>
      <span class="badge init" id="backendBadge" role="status">未初始化</span>
      <span class="fps" id="fpsLabel">— fps</span>
      <button id="resetBtn" type="button">重設視圖</button>
    </header>

    <main class="workspace">
      <section id="viewer" aria-label="PDF 頁面檢視區">
        <canvas id="canvas"></canvas>
        <div id="textLayer" aria-hidden="true"></div>
        <svg id="annotationOverlay" aria-hidden="true"></svg>
      </section>
      <aside class="diagnostics">
        <h2>狀態</h2>
        <pre id="status">等待載入 PDF...</pre>
        <h2>渲染統計</h2>
        <pre id="stats">—</pre>
        <h2>操作</h2>
        <pre class="help">· 拖曳平移
· 滾輪縮放（以游標為中心）
· 拉到 6400% 觀察向量清晰度</pre>
        <h2>表格格子</h2>
        <p id="fontStatus" class="font-status">預覽使用系統 Calibri 與標楷體。若沒有標楷體，請從 C:\Windows\Fonts\ 複製 kaiu.ttf 到「下載」資料夾，再按「嵌入標楷體」載入。</p>
        <div class="cell-tools">
          <label>字級 pt <input id="fontSize" type="number" min="4" max="72" step="0.5" value="12" /></label>
          <label>行距倍數 <input id="lineSpacing" type="number" min="0.5" max="3" step="0.01" value="1" /></label>
          <label class="checkbox-label"><input id="autoFit" type="checkbox" checked />文字過多時自動縮小</label>
          <label>編號範圍 <input id="cellRange" type="text" value="1-4,8,9" /></label>
          <label>步長 pt <input id="adjustStep" type="number" min="0.1" max="20" step="0.5" value="1" /></label>
          <div class="adjust-grid">
            <button data-adjust="up" type="button">▲</button>
            <button data-adjust="left" type="button">◀</button>
            <button data-adjust="right" type="button">▶</button>
            <button data-adjust="down" type="button">▼</button>
            <button data-adjust="width-dec" type="button">寬 −</button>
            <button data-adjust="width-inc" type="button">寬 +</button>
            <button data-adjust="height-dec" type="button">高 −</button>
            <button data-adjust="height-inc" type="button">高 +</button>
          </div>
          <button id="resetCellsBtn" type="button">還原選取格子</button>
        </div>
        <div id="cellEditors" class="cell-editors" aria-live="polite">框選表格區域以偵測格子。</div>
      </aside>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
