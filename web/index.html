<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>PDF 表格編輯器 - 向量渲染原型</title>
    <link rel="stylesheet" href="./src/ui/styles/app.css" />
  </head>
  <body>
    <header class="toolbar">
      <input type="file" id="fileInput" accept="application/pdf,.pdf" aria-label="選擇 PDF" />
      <label class="toolbar-control">縮放
        <input type="range" id="zoomSlider" min="0.1" max="64" step="0.1" value="1" />
        <span class="zoom-value" id="zoomLabel">100%</span>
      </label>
      <label class="toolbar-control">後端
        <select id="backendSelect" aria-label="渲染後端">
          <option value="auto">自動</option>
          <option value="webgpu">WebGPU</option>
          <option value="webgl">WebGL</option>
        </select>
      </label>
      <span class="badge init" id="backendBadge" role="status">未初始化</span>
      <span class="fps" id="fpsLabel">— fps</span>
      <button id="resetBtn" type="button">重設視圖</button>
    </header>

    <main class="workspace">
      <section id="viewer" aria-label="PDF 頁面檢視區">
        <canvas id="canvas"></canvas>
        <div id="textLayer" aria-hidden="true"></div>
      </section>
      <aside class="diagnostics">
        <h2>狀態</h2>
        <pre id="status">等待載入 PDF...</pre>
        <h2>渲染統計</h2>
        <pre id="stats">—</pre>
        <h2>操作</h2>
        <pre class="help">· 拖曳平移
· 滾輪縮放（以游標為中心）
· 拉到 6400% 觀察向量清晰度</pre>
      </aside>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
