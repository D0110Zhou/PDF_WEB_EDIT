<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>PDF 矢量渲染器 · P0-1e (scanline)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  body { display: flex; flex-direction: column; background: #1e1e1e; color: #eee; overflow: hidden; }

  header {
    display: flex; gap: 12px; padding: 10px 14px;
    background: #2a2a2a; border-bottom: 1px solid #444;
    align-items: center; flex-wrap: wrap;
  }
  header label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  header input[type=file] { color: #eee; font-size: 12px; }
  header button, header select, header input[type=range] { font-size: 13px; }
  header button {
    padding: 5px 12px; background: #0078D7; color: white;
    border: none; border-radius: 4px; cursor: pointer;
  }
  header button:hover { background: #106ebe; }

  main { flex: 1; display: flex; overflow: hidden; position: relative; }
  #viewer { flex: 1; position: relative; overflow: hidden; background: white; }
  #canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }

  #textLayer {
    position: absolute; top: 0; left: 0;
    pointer-events: none; transform-origin: 0 0;
  }
  #textLayer span {
    position: absolute; white-space: pre; color: #000; line-height: 1;
    transform-origin: 0 0;
    font-family: "Arial", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }

  aside {
    width: 340px; padding: 10px; background: #2a2a2a;
    border-left: 1px solid #444; overflow-y: auto; font-size: 12px;
  }
  aside h3 { margin: 0 0 6px; font-size: 13px; color: #4fc3f7; }
  aside pre {
    margin: 0 0 12px; padding: 8px; background: #1a1a1a;
    border-radius: 3px; font-size: 11px; overflow-x: auto;
    max-height: 280px; overflow-y: auto; line-height: 1.5; color: #b0bec5;
    white-space: pre-wrap;
  }

  .badge { padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
  .badge.gpu { background: #2e7d32; color: white; }
  .badge.gl  { background: #1565c0; color: white; }
  .badge.err { background: #c62828; color: white; }
  .badge.init { background: #555; color: #aaa; }
  .zoom-value { font-family: "Consolas", monospace; font-weight: bold; color: #4fc3f7; min-width: 70px; }
  .fps { font-family: "Consolas", monospace; color: #81c784; font-weight: bold; }
</style>
</head>
<body>

<header>
  <input type="file" id="fileInput" accept=".pdf">
  <label>縮放
    <input type="range" id="zoomSlider" min="0.1" max="64" step="0.1" value="1">
    <span class="zoom-value" id="zoomLabel">100%</span>
  </label>
  <label>後端
    <select id="backendSelect">
      <option value="auto">自動</option>
      <option value="webgpu">WebGPU</option>
      <option value="webgl">WebGL</option>
    </select>
  </label>
  <span class="badge init" id="backendBadge">未初始化</span>
  <span class="fps" id="fpsLabel">— fps</span>
  <button id="resetBtn">重設視圖</button>
</header>

<main>
  <div id="viewer">
    <canvas id="canvas"></canvas>
    <div id="textLayer"></div>
  </div>
  <aside>
    <h3>狀態</h3>
    <pre id="status">等待載入 PDF...</pre>
    <h3>渲染統計</h3>
    <pre id="stats">—</pre>
    <h3>操作</h3>
    <pre>· 拖曳平移
· 滾輪縮放（以游標為中心）
· 拉到 6400% 觀察矢量清晰度</pre>
  </aside>
</main>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const OPS  = pdfjsLib.OPS;
const Util = pdfjsLib.Util;

// ═════════════════════════════════════════════════════════════
// 1. 幾何工具
// ═════════════════════════════════════════════════════════════

function flattenBezier(p0, p1, p2, p3, out, minSteps = 8, maxSteps = 256) {
  const chord =
    Math.hypot(p1[0]-p0[0], p1[1]-p0[1]) +
    Math.hypot(p2[0]-p1[0], p2[1]-p1[1]) +
    Math.hypot(p3[0]-p2[0], p3[1]-p2[1]);
  const steps = Math.min(maxSteps, Math.max(minSteps, Math.ceil(chord * 2)));
  for (let i = 1; i <= steps; i++) {
    const t = i / steps, mt = 1 - t;
    const x = mt*mt*mt*p0[0] + 3*mt*mt*t*p1[0] + 3*mt*t*t*p2[0] + t*t*t*p3[0];
    const y = mt*mt*mt*p0[1] + 3*mt*mt*t*p1[1] + 3*mt*t*t*p2[1] + t*t*t*p3[1];
    out.push([x, y]);
  }
}

// ═════════════════════════════════════════════════════════════
// 2. 掃描線奇偶填充（消除白色縫隙）
// ═════════════════════════════════════════════════════════════

/**
 * 用掃描線演算法將一組多邊形（可能帶洞、嵌套）轉為水平長條幾何。
 * 每個長條是一個四邊形（含 0.5px 的重疊避免縫隙）。
 *
 * @param {Array<Array<[number,number]>>} polys 所有輪廓
 * @param {number} scanStep 掃描線間距（pt），預設 0.4
 * @returns { vertices: Float32Array, indices: Uint32Array }
 */
function scanlineFill(polys, scanStep = 0.4) {
  // 1. 收集所有邊 + y 範圍
  const edges = [];
  let minY = Infinity, maxY = -Infinity;

  for (const poly of polys) {
    if (poly.length < 3) continue;
    const n = poly.length;
    for (let i = 0; i < n; i++) {
      const [x0, y0] = poly[i];
      const [x1, y1] = poly[(i + 1) % n];
      if (y0 === y1) continue;
      edges.push({
        y0: Math.min(y0, y1), y1: Math.max(y0, y1),
        x0: y0 < y1 ? x0 : x1,
        x1: y0 < y1 ? x1 : x0,
      });
      if (y0 < minY) minY = y0;
      if (y0 > maxY) maxY = y0;
      if (y1 < minY) minY = y1;
      if (y1 > maxY) maxY = y1;
    }
  }

  if (!isFinite(minY)) return { vertices: new Float32Array(0), indices: new Uint32Array(0) };

  const spanCount = Math.ceil((maxY - minY) / scanStep);
  if (spanCount <= 0 || spanCount > 200000) {
    // 幾何過於極端，回傳空
    return { vertices: new Float32Array(0), indices: new Uint32Array(0) };
  }

  const verts = [];
  const inds = [];

  // 每條掃描線的 y 中心
  const yStart = minY + scanStep / 2;
  const yEnd   = maxY;
  const overlap = scanStep * 0.15;   // 讓相鄰長條稍微重疊

  for (let y = yStart; y < yEnd; y += scanStep) {
    const xs = [];
    for (const e of edges) {
      if (y >= e.y0 && y < e.y1) {
        const t = (y - e.y0) / (e.y1 - e.y0);
        xs.push(e.x0 + t * (e.x1 - e.x0));
      }
    }
    if (xs.length < 2) continue;
    xs.sort((a, b) => a - b);

    // 奇偶：每兩個交點之間填一個長條
    for (let i = 0; i + 1 < xs.length; i += 2) {
      const xa = xs[i], xb = xs[i + 1];
      if (xb - xa < 1e-6) continue;
      const y0 = y - scanStep / 2 - overlap;
      const y1 = y + scanStep / 2 + overlap;
      const base = verts.length / 2;
      verts.push(xa, y0, xb, y0, xb, y1, xa, y1);
      inds.push(base, base+1, base+2, base, base+2, base+3);
    }
  }

  return {
    vertices: new Float32Array(verts),
    indices: new Uint32Array(inds),
  };
}

// ═════════════════════════════════════════════════════════════
// 3. PDF Operator List → 幾何批次
// ═════════════════════════════════════════════════════════════

function parseOperators(opList) {
  const fns  = opList.fnArray;
  const args = opList.argsArray;
  const batches = [];
  const stats = { constructPath: 0, pathMatched: 0, fill: 0, stroke: 0,
                  endPath: 0, formBegin: 0, formEnd: 0, joins: 0 };

  let ctm = [1, 0, 0, 1, 0, 0];
  const ctmStack = [];
  let fillColor = [0, 0, 0, 1];
  let strokeColor = [0, 0, 0, 1];
  let lineWidth = 1;
  let lineCap = 0;
  let lineJoin = 0;
  let pendingPolys = [];

  const applyCTM = (x, y) => {
    const [a, b, c, d, e, f] = ctm;
    return [a*x + c*y + e, b*x + d*y + f];
  };
  const scaleLineWidth = w => {
    const [a, b, c, d] = ctm;
    return w * (Math.hypot(a, b) + Math.hypot(c, d)) / 2;
  };
  const mulCTM = (m1, m2) => {
    const [a1, b1, c1, d1, e1, f1] = m1;
    const [a2, b2, c2, d2, e2, f2] = m2;
    return [
      a1*a2 + c1*b2, b1*a2 + d1*b2,
      a1*c2 + c1*d2, b1*c2 + d1*d2,
      a1*e2 + c1*f2 + e1, b1*e2 + d1*f2 + f1,
    ];
  };
  const grayToRGB = v => [v, v, v];
  const cmykToRGB = (c, m, y, k) => [(1-c)*(1-k), (1-m)*(1-k), (1-y)*(1-k)];

  // ★ 填色用 scanline（無縫隙）；只有非常小的路徑（< 32 點）才用 earcut 快速路徑
  const emitFill = polys => {
    const [r, g, b] = fillColor;

    // 邊界框快速判斷，避免極小或極大的路徑浪費時間
    let totalPts = 0;
    for (const p of polys) totalPts += p.length;
    if (totalPts === 0) return;

    const { vertices, indices } = scanlineFill(polys, 0.4);
    if (!indices.length) return;

    batches.push({
      kind: 'fill',
      vertices,
      indices,
      color: [r, g, b, 1],
    });
  };

  const emitStroke = polys => {
    const verts = [], indices = [];
    const [r, g, b] = strokeColor;
    const halfW = Math.max(scaleLineWidth(lineWidth) / 2, 0.05);

    const pushTri = (ax, ay, bx, by, cx, cy) => {
      const base = verts.length / 2;
      verts.push(ax, ay, bx, by, cx, cy);
      indices.push(base, base + 1, base + 2);
    };

    const quad = (ax, ay, bx, by) => {
      const dx = bx - ax, dy = by - ay;
      const len = Math.hypot(dx, dy);
      if (len < 1e-9) return;
      const nx = -dy / len * halfW, ny = dx / len * halfW;
      pushTri(ax+nx, ay+ny, bx+nx, by+ny, bx-nx, by-ny);
      pushTri(ax+nx, ay+ny, bx-nx, by-ny, ax-nx, ay-ny);
    };

    // 頂點圓盤（12 段近似）
    const disc = (cx, cy) => {
      const seg = 12;
      const PI2 = Math.PI * 2;
      let px = cx + halfW, py = cy;
      for (let i = 1; i <= seg; i++) {
        const a = (i / seg) * PI2;
        const qx = cx + Math.cos(a) * halfW;
        const qy = cy + Math.sin(a) * halfW;
        pushTri(cx, cy, px, py, qx, qy);
        px = qx; py = qy;
      }
    };

    for (const poly of polys) {
      if (poly.length < 2) continue;
      for (let i = 0; i < poly.length - 1; i++) {
        quad(poly[i][0], poly[i][1], poly[i+1][0], poly[i+1][1]);
      }

      const isClosed =
        poly.length >= 3 &&
        Math.abs(poly[0][0] - poly[poly.length-1][0]) < 1e-6 &&
        Math.abs(poly[0][1] - poly[poly.length-1][1]) < 1e-6;

      const innerEnd = isClosed ? poly.length - 1 : poly.length;
      for (let i = 1; i < innerEnd; i++) {
        disc(poly[i][0], poly[i][1]);
        stats.joins++;
      }
      if (isClosed && poly.length >= 3) {
        disc(poly[0][0], poly[0][1]);
        stats.joins++;
      }
      if (!isClosed && lineCap === 1 && poly.length >= 2) {
        disc(poly[0][0], poly[0][1]);
        disc(poly[poly.length-1][0], poly[poly.length-1][1]);
        stats.joins += 2;
      }
    }

    if (indices.length) {
      batches.push({
        kind: 'stroke',
        vertices: new Float32Array(verts),
        indices:  new Uint32Array(indices),
        color: [r, g, b, 1],
      });
    }
  };

  for (let i = 0; i < fns.length; i++) {
    const op = fns[i], a = args[i];
    switch (op) {
      case OPS.save:    ctmStack.push(ctm.slice()); break;
      case OPS.restore: if (ctmStack.length) ctm = ctmStack.pop(); break;
      case OPS.transform: ctm = mulCTM(ctm, a); break;

      case OPS.paintFormXObjectBegin: {
        stats.formBegin++;
        ctmStack.push(ctm.slice());
        const formMatrix = a && a[0];
        if (formMatrix && formMatrix.length === 6) ctm = mulCTM(ctm, formMatrix);
        break;
      }
      case OPS.paintFormXObjectEnd: {
        stats.formEnd++;
        if (ctmStack.length) ctm = ctmStack.pop();
        break;
      }

      case OPS.setLineWidth:        lineWidth = a[0]; break;
      case OPS.setLineCap:          lineCap = a[0]; break;
      case OPS.setLineJoin:         lineJoin = a[0]; break;
      case OPS.setFillRGBColor:     fillColor = a; break;
      case OPS.setStrokeRGBColor:   strokeColor = a; break;
      case OPS.setFillGray:         fillColor = grayToRGB(a[0]); break;
      case OPS.setStrokeGray:       strokeColor = grayToRGB(a[0]); break;
      case OPS.setFillCMYKColor:    fillColor = cmykToRGB(a[0], a[1], a[2], a[3]); break;
      case OPS.setStrokeCMYKColor:  strokeColor = cmykToRGB(a[0], a[1], a[2], a[3]); break;

      case OPS.constructPath: {
        stats.constructPath++;
        if (!Array.isArray(a) || a.length < 2) break;
        let pathData, pathOps;
        const p0 = a[0], p1 = a[1];
        if (Array.isArray(p0) && Array.isArray(p1)) {
          if (p0.length <= p1.length) { pathOps = p0; pathData = p1; }
          else                        { pathData = p0; pathOps = p1; }
        } else break;

        let ai = 0;
        let poly = [];
        for (const po of pathOps) {
          switch (po) {
            case OPS.moveTo:
              if (poly.length > 1) pendingPolys.push(poly);
              poly = [];
              poly.push(applyCTM(pathData[ai++], pathData[ai++]));
              break;
            case OPS.lineTo:
              poly.push(applyCTM(pathData[ai++], pathData[ai++]));
              break;
            case OPS.curveTo: {
              const x1 = pathData[ai++], y1 = pathData[ai++];
              const x2 = pathData[ai++], y2 = pathData[ai++];
              const x3 = pathData[ai++], y3 = pathData[ai++];
              const last = poly.length ? poly[poly.length - 1] : [0, 0];
              flattenBezier(last, applyCTM(x1, y1), applyCTM(x2, y2), applyCTM(x3, y3), poly);
              break;
            }
            case OPS.curveTo2: {
              const x2 = pathData[ai++], y2 = pathData[ai++];
              const x3 = pathData[ai++], y3 = pathData[ai++];
              const last = poly.length ? poly[poly.length - 1] : [0, 0];
              flattenBezier(last, last, applyCTM(x2, y2), applyCTM(x3, y3), poly);
              break;
            }
            case OPS.curveTo3: {
              const x1 = pathData[ai++], y1 = pathData[ai++];
              const x3 = pathData[ai++], y3 = pathData[ai++];
              const last = poly.length ? poly[poly.length - 1] : [0, 0];
              const c1 = applyCTM(x1, y1), c3 = applyCTM(x3, y3);
              flattenBezier(last, c1, c3, c3, poly);
              break;
            }
            case OPS.closePath: {
              if (poly.length > 1) {
                poly.push([poly[0][0], poly[0][1]]);
                pendingPolys.push(poly);
              }
              poly = [];
              break;
            }
            case OPS.rectangle: {
              const x = pathData[ai++], y = pathData[ai++];
              const w = pathData[ai++], h = pathData[ai++];
              if (poly.length > 1) pendingPolys.push(poly);
              poly = [];
              const p1 = applyCTM(x, y);
              const p2 = applyCTM(x + w, y);
              const p3 = applyCTM(x + w, y + h);
              const p4 = applyCTM(x, y + h);
              pendingPolys.push([p1, p2, p3, p4, [p1[0], p1[1]]]);
              break;
            }
          }
        }
        if (poly.length > 1) pendingPolys.push(poly);
        stats.pathMatched++;
        break;
      }

      case OPS.fill:
      case OPS.eoFill:
      case OPS.stroke:
      case OPS.fillStroke:
      case OPS.eoFillStroke: {
        if (!pendingPolys.length) break;
        const doFill   = op === OPS.fill   || op === OPS.eoFill ||
                         op === OPS.fillStroke || op === OPS.eoFillStroke;
        const doStroke = op === OPS.stroke ||
                         op === OPS.fillStroke || op === OPS.eoFillStroke;
        if (doFill)   { emitFill(pendingPolys.map(p => p.slice()));   stats.fill++; }
        if (doStroke) { emitStroke(pendingPolys.map(p => p.slice())); stats.stroke++; }
        pendingPolys = [];
        break;
      }

      case OPS.endPath:
        stats.endPath++;
        pendingPolys = [];
        break;
    }
  }

  console.log('[parseOperators] 統計:', stats);
  return batches;
}

// ═════════════════════════════════════════════════════════════
// 4. 合併工具
// ═════════════════════════════════════════════════════════════

function mergeBatches(batches) {
  let vCount = 0, iCount = 0;
  for (const b of batches) {
    vCount += b.vertices.length / 2;
    iCount += b.indices.length;
  }
  if (iCount === 0) {
    return { vertices: new Float32Array(0), indices: new Uint32Array(0),
             vertexCount: 0, indexCount: 0 };
  }
  const vertices = new Float32Array(vCount * 6);
  const indices  = new Uint32Array(iCount);
  let vOff = 0, iOff = 0, vBase = 0;
  for (const b of batches) {
    const [r, g, bl, a] = b.color;
    const nVerts = b.vertices.length / 2;
    for (let i = 0; i < nVerts; i++) {
      vertices[vOff++] = b.vertices[i * 2];
      vertices[vOff++] = b.vertices[i * 2 + 1];
      vertices[vOff++] = r;
      vertices[vOff++] = g;
      vertices[vOff++] = bl;
      vertices[vOff++] = a;
    }
    const nIdx = b.indices.length;
    for (let i = 0; i < nIdx; i++) {
      indices[iOff++] = vBase + b.indices[i];
    }
    vBase += nVerts;
  }
  return { vertices, indices, vertexCount: vCount, indexCount: iCount };
}

// ═════════════════════════════════════════════════════════════
// 5. WebGL 後端
// ═════════════════════════════════════════════════════════════

class WebGLBackend {
  constructor(canvas) {
    this.canvas = canvas;
    this.gl = canvas.getContext('webgl2', { antialias: true, premultipliedAlpha: false })
           || canvas.getContext('webgl',  { antialias: true, premultipliedAlpha: false });
    if (!this.gl) throw new Error('WebGL 不可用');
    if (!(this.gl instanceof WebGL2RenderingContext) &&
        !this.gl.getExtension('OES_element_index_uint')) {
      throw new Error('缺少 OES_element_index_uint 擴展');
    }
    this._initShaders();
    this.fillVBO = null; this.fillIBO = null; this.fillIdxCount = 0;
    this.strokeVBO = null; this.strokeIBO = null; this.strokeIdxCount = 0;
  }

  _initShaders() {
    const gl = this.gl;
    const vs = `
      attribute vec2 a_pos;
      attribute vec4 a_color;
      uniform mat3 u_matrix;
      varying vec4 v_color;
      void main() {
        vec3 p = u_matrix * vec3(a_pos, 1.0);
        gl_Position = vec4(p.xy, 0.0, 1.0);
        v_color = a_color;
      }`;
    const fs = `
      precision mediump float;
      varying vec4 v_color;
      void main() { gl_FragColor = v_color; }`;

    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error('Shader 錯誤: ' + gl.getShaderInfoLog(s));
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
      throw new Error('Program 連結失敗: ' + gl.getProgramInfoLog(prog));

    this.prog = prog;
    this.aPos = gl.getAttribLocation(prog, 'a_pos');
    this.aColor = gl.getAttribLocation(prog, 'a_color');
    this.uMatrix = gl.getUniformLocation(prog, 'u_matrix');
  }

  destroyGeometry() {
    const gl = this.gl;
    for (const k of ['fillVBO','fillIBO','strokeVBO','strokeIBO']) {
      if (this[k]) { gl.deleteBuffer(this[k]); this[k] = null; }
    }
    this.fillIdxCount = this.strokeIdxCount = 0;
  }

  uploadGeometry(batches) {
    this.destroyGeometry();
    const gl = this.gl;
    const F = mergeBatches(batches.filter(b => b.kind !== 'stroke'));
    const S = mergeBatches(batches.filter(b => b.kind === 'stroke'));

    if (F.indexCount > 0) {
      this.fillVBO = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, this.fillVBO);
      gl.bufferData(gl.ARRAY_BUFFER, F.vertices, gl.STATIC_DRAW);
      this.fillIBO = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.fillIBO);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, F.indices, gl.STATIC_DRAW);
      this.fillIdxCount = F.indexCount;
    }
    if (S.indexCount > 0) {
      this.strokeVBO = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, this.strokeVBO);
      gl.bufferData(gl.ARRAY_BUFFER, S.vertices, gl.STATIC_DRAW);
      this.strokeIBO = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.strokeIBO);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, S.indices, gl.STATIC_DRAW);
      this.strokeIdxCount = S.indexCount;
    }
    return {
      fillTris: F.indexCount / 3,
      strokeTris: S.indexCount / 3,
      fillVerts: F.vertexCount,
      strokeVerts: S.vertexCount,
    };
  }

  render(matrix) {
    const gl = this.gl;
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    gl.clearColor(1, 1, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(this.prog);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniformMatrix3fv(this.uMatrix, false, matrix);

    let draws = 0;
    const STRIDE = 24;

    if (this.fillVBO && this.fillIdxCount > 0) {
      gl.bindBuffer(gl.ARRAY_BUFFER, this.fillVBO);
      gl.enableVertexAttribArray(this.aPos);
      gl.vertexAttribPointer(this.aPos, 2, gl.FLOAT, false, STRIDE, 0);
      gl.enableVertexAttribArray(this.aColor);
      gl.vertexAttribPointer(this.aColor, 4, gl.FLOAT, false, STRIDE, 8);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.fillIBO);
      gl.drawElements(gl.TRIANGLES, this.fillIdxCount, gl.UNSIGNED_INT, 0);
      draws++;
    }
    if (this.strokeVBO && this.strokeIdxCount > 0) {
      gl.bindBuffer(gl.ARRAY_BUFFER, this.strokeVBO);
      gl.enableVertexAttribArray(this.aPos);
      gl.vertexAttribPointer(this.aPos, 2, gl.FLOAT, false, STRIDE, 0);
      gl.enableVertexAttribArray(this.aColor);
      gl.vertexAttribPointer(this.aColor, 4, gl.FLOAT, false, STRIDE, 8);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.strokeIBO);
      gl.drawElements(gl.TRIANGLES, this.strokeIdxCount, gl.UNSIGNED_INT, 0);
      draws++;
    }
    return draws;
  }
}

// ═════════════════════════════════════════════════════════════
// 6. WebGPU 後端（4× MSAA）
// ═════════════════════════════════════════════════════════════

class WebGPUBackend {
  constructor(canvas) { this.canvas = canvas; }

  async init() {
    if (!navigator.gpu) throw new Error('此瀏覽器不支援 WebGPU');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('找不到 WebGPU adapter');
    this.device = await adapter.requestDevice();

    this.ctx = this.canvas.getContext('webgpu');
    if (!this.ctx) throw new Error('無法取得 webgpu context');
    this.format = navigator.gpu.getPreferredCanvasFormat();
    this.ctx.configure({ device: this.device, format: this.format, alphaMode: 'premultiplied' });

    this.sampleCount = 4;

    const shaderCode = `
      struct U { mvp: mat3x3<f32> };
      @group(0) @binding(0) var<uniform> u: U;

      struct VOut {
        @builtin(position) pos: vec4<f32>,
        @location(0) color: vec4<f32>,
      };

      @vertex
      fn vs(@location(0) p: vec2<f32>, @location(1) c: vec4<f32>) -> VOut {
        var o: VOut;
        let m = u.mvp * vec3<f32>(p, 1.0);
        o.pos = vec4<f32>(m.xy, 0.0, 1.0);
        o.color = c;
        return o;
      }

      @fragment
      fn fs(in: VOut) -> @location(0) vec4<f32> {
        return in.color;
      }`;

    const shaderModule = this.device.createShaderModule({ code: shaderCode });

    this.pipeline = this.device.createRenderPipeline({
      layout: 'auto',
      vertex: {
        module: shaderModule, entryPoint: 'vs',
        buffers: [{
          arrayStride: 24,
          attributes: [
            { shaderLocation: 0, offset: 0, format: 'float32x2' },
            { shaderLocation: 1, offset: 8, format: 'float32x4' },
          ],
        }],
      },
      fragment: {
        module: shaderModule, entryPoint: 'fs',
        targets: [{
          format: this.format,
          blend: {
            color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
            alpha: { srcFactor: 'one',       dstFactor: 'one-minus-src-alpha', operation: 'add' },
          },
        }],
      },
      primitive: { topology: 'triangle-list' },
      multisample: { count: this.sampleCount },
    });

    this.mvpBuffer = this.device.createBuffer({
      size: 48,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    this.mvpBindGroup = this.device.createBindGroup({
      layout: this.pipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: this.mvpBuffer } }],
    });

    this.msaaTexture = null;
    this.msaaSize = { w: 0, h: 0 };
    this.fillVBO = null; this.fillIBO = null; this.fillIdxCount = 0;
    this.strokeVBO = null; this.strokeIBO = null; this.strokeIdxCount = 0;
  }

  _ensureMsaaTexture() {
    const w = this.canvas.width, h = this.canvas.height;
    if (this.msaaTexture && this.msaaSize.w === w && this.msaaSize.h === h) return;
    if (this.msaaTexture) this.msaaTexture.destroy();
    this.msaaTexture = this.device.createTexture({
      size: [w, h],
      sampleCount: this.sampleCount,
      format: this.format,
      usage: GPUTextureUsage.RENDER_ATTACHMENT,
    });
    this.msaaSize = { w, h };
  }

  destroyGeometry() {
    for (const k of ['fillVBO','fillIBO','strokeVBO','strokeIBO']) {
      if (this[k]) { this[k].destroy(); this[k] = null; }
    }
    this.fillIdxCount = this.strokeIdxCount = 0;
  }

  uploadGeometry(batches) {
    this.destroyGeometry();
    const F = mergeBatches(batches.filter(b => b.kind !== 'stroke'));
    const S = mergeBatches(batches.filter(b => b.kind === 'stroke'));

    const upload = (m, kind) => {
      if (m.indexCount === 0) return;
      const vb = this.device.createBuffer({
        size: m.vertices.byteLength,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
      });
      this.device.queue.writeBuffer(vb, 0, m.vertices);
      const ib = this.device.createBuffer({
        size: m.indices.byteLength,
        usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
      });
      this.device.queue.writeBuffer(ib, 0, m.indices);
      if (kind === 'fill') {
        this.fillVBO = vb; this.fillIBO = ib; this.fillIdxCount = m.indexCount;
      } else {
        this.strokeVBO = vb; this.strokeIBO = ib; this.strokeIdxCount = m.indexCount;
      }
    };
    upload(F, 'fill');
    upload(S, 'stroke');

    return {
      fillTris: F.indexCount / 3,
      strokeTris: S.indexCount / 3,
      fillVerts: F.vertexCount,
      strokeVerts: S.vertexCount,
    };
  }

  render(matrix) {
    const mvp = new Float32Array(12);
    mvp[0]=matrix[0]; mvp[1]=matrix[1]; mvp[2]=matrix[2]; mvp[3]=0;
    mvp[4]=matrix[3]; mvp[5]=matrix[4]; mvp[6]=matrix[5]; mvp[7]=0;
    mvp[8]=matrix[6]; mvp[9]=matrix[7]; mvp[10]=matrix[8]; mvp[11]=0;
    this.device.queue.writeBuffer(this.mvpBuffer, 0, mvp);

    this._ensureMsaaTexture();

    const enc = this.device.createCommandEncoder();
    const swapView = this.ctx.getCurrentTexture().createView();
    const msaaView = this.msaaTexture.createView();

    const pass = enc.beginRenderPass({
      colorAttachments: [{
        view: msaaView,
        resolveTarget: swapView,
        loadOp: 'clear',
        storeOp: 'discard',
        clearValue: { r: 1, g: 1, b: 1, a: 1 },
      }],
    });

    pass.setPipeline(this.pipeline);
    pass.setBindGroup(0, this.mvpBindGroup);

    let draws = 0;
    if (this.fillVBO && this.fillIdxCount > 0) {
      pass.setVertexBuffer(0, this.fillVBO);
      pass.setIndexBuffer(this.fillIBO, 'uint32');
      pass.drawIndexed(this.fillIdxCount);
      draws++;
    }
    if (this.strokeVBO && this.strokeIdxCount > 0) {
      pass.setVertexBuffer(0, this.strokeVBO);
      pass.setIndexBuffer(this.strokeIBO, 'uint32');
      pass.drawIndexed(this.strokeIdxCount);
      draws++;
    }

    pass.end();
    this.device.queue.submit([enc.finish()]);
    return draws;
  }
}

// ═════════════════════════════════════════════════════════════
// 7. 主應用
// ═════════════════════════════════════════════════════════════

class App {
  constructor() {
    this.canvas    = document.getElementById('canvas');
    this.viewer    = document.getElementById('viewer');
    this.textLayer = document.getElementById('textLayer');
    this.zoomLabel = document.getElementById('zoomLabel');
    this.statusEl  = document.getElementById('status');
    this.statsEl   = document.getElementById('stats');
    this.badgeEl   = document.getElementById('backendBadge');
    this.fpsLabel  = document.getElementById('fpsLabel');

    this.pdfDoc = null;
    this.pdfPage = null;
    this.pageWidth = 0;
    this.pageHeight = 0;
    this.textContent = null;
    this.batches = [];

    this.backend = null;
    this.backendName = '';
    this.geoStats = null;

    this.zoom = 1;
    this.panX = 0;
    this.panY = 0;
    this.dpr = 1;

    this.dragging = false;
    this.lastMouse = null;
    this._rebuildScheduled = false;
    this._renderScheduled = false;
    this._frameTimes = [];

    this._bindUI();
    this._bindCanvas();
    this._resizeCanvas();
    window.addEventListener('resize', () => {
      this._resizeCanvas();
      this._render();
    });
  }

  _log(msg) {
    const el = this.statusEl;
    const lines = el.textContent.split('\n');
    if (lines.length === 1 && lines[0] === '等待載入 PDF...') lines.length = 0;
    lines.push(msg);
    while (lines.length > 40) lines.shift();
    el.textContent = lines.join('\n');
    el.scrollTop = el.scrollHeight;
  }

  _bindUI() {
    document.getElementById('fileInput').addEventListener('change', e => {
      const f = e.target.files?.[0];
      if (f) this.loadPDF(f);
    });

    document.getElementById('zoomSlider').addEventListener('input', e => {
      this.zoom = parseFloat(e.target.value);
      this.zoomLabel.textContent = Math.round(this.zoom * 100) + '%';
      this._scheduleRebuildTextLayer();
      this._render();
    });

    document.getElementById('backendSelect').addEventListener('change', async e => {
      if (this.pdfDoc) {
        await this._initBackend(e.target.value);
        if (this.backend && this.batches.length) {
          this.geoStats = this.backend.uploadGeometry(this.batches);
        }
      }
      this._render();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      this.zoom = 1; this.panX = 0; this.panY = 0;
      document.getElementById('zoomSlider').value = 1;
      this.zoomLabel.textContent = '100%';
      this._scheduleRebuildTextLayer();
      this._render();
    });
  }

  _bindCanvas() {
    const c = this.canvas;

    c.addEventListener('mousedown', e => {
      this.dragging = true;
      this.lastMouse = { x: e.clientX, y: e.clientY };
      c.classList.add('dragging');
    });
    window.addEventListener('mousemove', e => {
      if (!this.dragging) return;
      const dx = e.clientX - this.lastMouse.x;
      const dy = e.clientY - this.lastMouse.y;
      this.lastMouse = { x: e.clientX, y: e.clientY };
      this.panX += dx; this.panY += dy;
      this._render();
    });
    window.addEventListener('mouseup', () => {
      this.dragging = false;
      c.classList.remove('dragging');
    });

    c.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      const z = this.zoom;
      const z2 = Math.max(0.1, Math.min(64, z * factor));
      if (z2 === z) return;

      const rect = this.viewer.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      const pw = this.pageWidth, ph = this.pageHeight;
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const px = (mx - W/2 - this.panX + pw * z / 2) / z;
      const py = ph - (my - H/2 - this.panY + ph * z / 2) / z;

      this.panX = mx - W/2 + pw * z2 / 2 - px * z2;
      this.panY = my - H/2 + ph * z2 / 2 - (ph - py) * z2;
      this.zoom = z2;

      document.getElementById('zoomSlider').value = Math.min(64, z2);
      this.zoomLabel.textContent = Math.round(z2 * 100) + '%';
      this._scheduleRebuildTextLayer();
      this._render();
    }, { passive: false });
  }

  _resizeCanvas() {
    const rect = this.viewer.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width  = Math.max(1, Math.floor(rect.width  * dpr));
    this.canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    this.dpr = dpr;
  }

  async _initBackend(pref) {
    this.backend = null;
    this.backendName = '';
    this.geoStats = null;
    this.badgeEl.className = 'badge init';
    this.badgeEl.textContent = '初始化中...';

    const tryGPU = pref === 'auto' || pref === 'webgpu';
    const tryGL  = pref === 'auto' || pref === 'webgl';

    if (tryGPU) {
      try {
        const gpu = new WebGPUBackend(this.canvas);
        await gpu.init();
        this.backend = gpu;
        this.backendName = 'WebGPU (4× MSAA)';
        this.badgeEl.className = 'badge gpu';
        this.badgeEl.textContent = 'WebGPU';
        this._log('✓ WebGPU 初始化成功（4× MSAA）');
        return;
      } catch (e) {
        this._log('✗ WebGPU 失敗: ' + e.message);
        if (pref === 'webgpu') {
          this.badgeEl.className = 'badge err';
          this.badgeEl.textContent = 'WebGPU 不可用';
          throw e;
        }
      }
    }

    if (tryGL) {
      try {
        const gl = new WebGLBackend(this.canvas);
        this.backend = gl;
        this.backendName = 'WebGL (antialias)';
        this.badgeEl.className = 'badge gl';
        this.badgeEl.textContent = 'WebGL';
        this._log('✓ WebGL 初始化成功（降級路徑）');
        return;
      } catch (e) {
        this._log('✗ WebGL 失敗: ' + e.message);
        this.badgeEl.className = 'badge err';
        this.badgeEl.textContent = '無可用後端';
        throw e;
      }
    }
  }

  async loadPDF(file) {
    this._log('載入: ' + file.name);
    if (this.backend) this.backend.destroyGeometry();

    const buf = await file.arrayBuffer();
    this.pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    this._log('頁數: ' + this.pdfDoc.numPages);

    const page = await this.pdfDoc.getPage(1);
    this.pdfPage = page;

    const vp0 = page.getViewport({ scale: 1 });
    this.pageWidth = vp0.width;
    this.pageHeight = vp0.height;
    this._log(`頁面尺寸: ${this.pageWidth.toFixed(1)} × ${this.pageHeight.toFixed(1)} pt`);

    this._log('解析 operator list...');
    const opList = await page.getOperatorList();
    this._log(`運算子數量: ${opList.fnArray.length}`);

    const opCounts = {};
    for (let i = 0; i < opList.fnArray.length; i++) {
      const op = opList.fnArray[i];
      opCounts[op] = (opCounts[op] || 0) + 1;
    }
    const opNames = {};
    for (const [name, code] of Object.entries(OPS)) opNames[code] = name;
    const topOps = Object.entries(opCounts)
      .sort((a, b) => b[1] - a[1]).slice(0, 12)
      .map(([code, n]) => `${opNames[code] || code}:${n}`).join(' ');
    this._log('Top OPS: ' + topOps);

    const t0 = performance.now();
    try {
      this.batches = parseOperators(opList);
    } catch (err) {
      this._log('✗ 解析失敗: ' + err.message);
      console.error(err);
      return;
    }
    const t1 = performance.now();
    this._log(`解析耗時: ${(t1 - t0).toFixed(1)} ms`);

    let fillB = 0, strokeB = 0;
    for (const b of this.batches) (b.kind === 'stroke' ? strokeB++ : fillB++);
    this._log(`原始批次: fill=${fillB}, stroke=${strokeB}, 合計=${this.batches.length}`);

    if (!this.backend) {
      await this._initBackend(document.getElementById('backendSelect').value);
    }

    this._log('上傳幾何至 GPU...');
    const t2 = performance.now();
    this.geoStats = this.backend.uploadGeometry(this.batches);
    const t3 = performance.now();
    this._log(`上傳耗時: ${(t3 - t2).toFixed(1)} ms`);
    this._log(`Fill 三角形: ${this.geoStats.fillTris.toLocaleString()}`);
    this._log(`Stroke 三角形: ${this.geoStats.strokeTris.toLocaleString()}`);

    this._log('取得文字內容...');
    const t4 = performance.now();
    this.textContent = await page.getTextContent();
    const t5 = performance.now();
    this._log(`文字項目數: ${this.textContent.items.length}`);
    this._log(`取文字耗時: ${(t5 - t4).toFixed(1)} ms`);

    this._rebuildTextLayer();
    this._render();
  }

  _computeMatrix() {
    const Wcss = this.canvas.width / this.dpr;
    const Hcss = this.canvas.height / this.dpr;
    const z = this.zoom;
    const pw = this.pageWidth, ph = this.pageHeight;
    const a = 2 * z / Wcss;
    const d = 2 * z / Hcss;
    const e = (2 * this.panX - pw * z) / Wcss;
    const f = (-2 * this.panY - ph * z) / Hcss;
    return new Float32Array([a, 0, 0, 0, d, 0, e, f, 1]);
  }

  _scheduleRebuildTextLayer() {
    if (this._rebuildScheduled) return;
    this._rebuildScheduled = true;
    requestAnimationFrame(() => {
      this._rebuildScheduled = false;
      this._rebuildTextLayer();
    });
  }

  _rebuildTextLayer() {
    if (!this.textLayer || !this.textContent || !this.pdfPage) return;
    const viewport = this.pdfPage.getViewport({ scale: this.zoom });
    this.textLayer.innerHTML = '';
    const frag = document.createDocumentFragment();

    for (const item of this.textContent.items) {
      const str = item.str;
      if (!str || !str.trim()) continue;
      const tx = Util.transform(viewport.transform, item.transform);
      const fontHeight = Math.hypot(tx[2], tx[3]);
      if (fontHeight < 0.5) continue;

      const span = document.createElement('span');
      span.textContent = str;
      span.style.left = tx[4] + 'px';
      span.style.top  = (tx[5] - fontHeight * 0.8) + 'px';
      span.style.fontSize = fontHeight + 'px';
      const angle = Math.atan2(tx[1], tx[0]);
      if (Math.abs(angle) > 0.001) span.style.transform = `rotate(${angle}rad)`;
      frag.appendChild(span);
    }
    this.textLayer.appendChild(frag);
    this._updateTextLayerPosition();
  }

  _updateTextLayerPosition() {
    if (!this.textLayer || !this.textContent) return;
    const rect = this.viewer.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    const z = this.zoom;
    const pw = this.pageWidth, ph = this.pageHeight;
    const ox = W / 2 + this.panX - pw * z / 2;
    const oy = H / 2 + this.panY - ph * z / 2;
    this.textLayer.style.transform = `translate(${ox}px, ${oy}px)`;
  }

  _render() {
    if (this._renderScheduled) return;
    this._renderScheduled = true;
    requestAnimationFrame(() => {
      this._renderScheduled = false;
      this._doRender();
    });
  }

  _doRender() {
    if (!this.backend) {
      this._updateTextLayerPosition();
      return;
    }
    const matrix = this._computeMatrix();
    const t0 = performance.now();
    const draws = this.backend.render(matrix);
    const t1 = performance.now();
    this._updateTextLayerPosition();

    const now = performance.now();
    this._frameTimes.push(now);
    while (this._frameTimes.length > 60) this._frameTimes.shift();
    let fps = '—';
    if (this._frameTimes.length >= 2) {
      const span = (now - this._frameTimes[0]) / 1000;
      fps = (this._frameTimes.length / span).toFixed(0);
    }
    this.fpsLabel.textContent = fps + ' fps';

    const g = this.geoStats || { fillTris: 0, strokeTris: 0 };
    this.statsEl.textContent =
      `後端:          ${this.backendName}\n` +
      `縮放:          ${(this.zoom * 100).toFixed(0)}%\n` +
      `Draw call:     ${draws}\n` +
      `Fill 三角形:   ${g.fillTris.toLocaleString()}\n` +
      `Stroke 三角形: ${g.strokeTris.toLocaleString()}\n` +
      `文字項目:      ${this.textContent ? this.textContent.items.length : 0}\n` +
      `渲染耗時:      ${(t1 - t0).toFixed(2)} ms\n` +
      `Canvas:        ${this.canvas.width}×${this.canvas.height}\n` +
      `DPR:           ${this.dpr}`;
  }
}

new App();
</script>
