<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>PDF 矢量渲染器 · P0-1</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  body { display: flex; flex-direction: column; background: #1e1e1e; color: #eee; }
  header { display: flex; gap: 12px; padding: 10px 14px; background: #2a2a2a; border-bottom: 1px solid #444; align-items: center; flex-wrap: wrap; }
  header label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  header input[type=file] { color: #eee; font-size: 12px; }
  header button, header select, header input[type=range] { font-size: 13px; }
  header button { padding: 5px 12px; background: #0078D7; color: white; border: none; border-radius: 4px; cursor: pointer; }
  header button:hover { background: #106ebe; }
  main { flex: 1; overflow: hidden; position: relative; }
  #textLayer {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;      /* 不影響滑鼠拖曳 */
  transform-origin: 0 0;     /* 與 WebGL 矩陣對齊的關鍵 */
  will-change: transform;
  }
  #textLayer span {
    position: absolute;
    white-space: pre;
    color: #000;
    line-height: 1;
    transform-origin: 0 0;
    font-family: "Arial", "Microsoft JhengHei", sans-serif;
  }
  #canvas { display: block; width: 100%; height: 100%; background: white; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  aside { width: 300px; padding: 10px; background: #2a2a2a; border-left: 1px solid #444; overflow-y: auto; font-size: 12px; }
  aside h3 { margin: 0 0 6px; font-size: 13px; color: #4fc3f7; }
  aside pre { margin: 0 0 12px; padding: 8px; background: #1a1a1a; border-radius: 3px; font-size: 11px; overflow-x: auto; max-height: 220px; overflow-y: auto; line-height: 1.5; color: #b0bec5; }
  .badge { padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
  .badge.gpu { background: #2e7d32; color: white; }
  .badge.gl { background: #1565c0; color: white; }
  .badge.err { background: #c62828; color: white; }
  .badge.init { background: #555; color: #aaa; }
  .zoom-value { font-family: "Consolas", monospace; font-weight: bold; color: #4fc3f7; min-width: 70px; }
</style>
</head>
<body>
<header>
  <input type="file" id="fileInput" accept=".pdf">
  <label>縮放
    <input type="range" id="zoomSlider" min="1" max="64" step="0.5" value="1">
    <span class="zoom-value" id="zoomLabel">100%</span>
  </label>
  <label>後端
    <select id="backendSelect">
      <option value="auto">自動</option>
      <option value="webgpu">WebGPU</option>
      <option value="webgl">WebGL</option>
    </select>
  </label>
  <span class="badge init" id="backendBadge">未初始化</span>
  <button id="resetBtn">重設視圖</button>
</header>
<main>
  <canvas id="canvas"></canvas>
  <div id="textLayer"></div> 
</main>
<aside>
  <h3>狀態</h3>
  <pre id="status">等待載入 PDF...</pre>
  <h3>渲染統計</h3>
  <pre id="stats">—</pre>
  <h3>操作</h3>
  <pre>· 拖曳平移
· 滾輪縮放（以游標為中心）
· 拉到 6400% 觀察矢量清晰度</pre>
</aside>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const OPS = pdfjsLib.OPS;

// ─────────────────────────────────────────────────────────────
// 1. 幾何工具
// ─────────────────────────────────────────────────────────────

function flattenBezier(p0, p1, p2, p3, out, steps = 16) {
  for (let i = 1; i <= steps; i++) {
    const t = i / steps, mt = 1 - t;
    const x = mt*mt*mt*p0[0] + 3*mt*mt*t*p1[0] + 3*mt*t*t*p2[0] + t*t*t*p3[0];
    const y = mt*mt*mt*p0[1] + 3*mt*mt*t*p1[1] + 3*mt*t*t*p2[1] + t*t*t*p3[1];
    out.push([x, y]);
  }
}

function signedArea(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length];
    a += x1 * y2 - x2 * y1;
  }
  return a / 2;
}

function pointInTri(p, a, b, c) {
  const d1 = (p[0]-b[0])*(a[1]-b[1]) - (a[0]-b[0])*(p[1]-b[1]);
  const d2 = (p[0]-c[0])*(b[1]-c[1]) - (b[0]-c[0])*(p[1]-c[1]);
  const d3 = (p[0]-a[0])*(c[1]-a[1]) - (c[0]-a[0])*(p[1]-a[1]);
  const hasNeg = d1 < 0 || d2 < 0 || d3 < 0;
  const hasPos = d1 > 0 || d2 > 0 || d3 > 0;
  return !(hasNeg && hasPos);
}

/** 耳切三角化（凸/凹簡單多邊形，逆時針） */
function earClip(poly) {
  const n = poly.length;
  if (n < 3) return { verts: poly, tris: [] };
  const verts = signedArea(poly) < 0 ? poly.slice().reverse() : poly;
  const idx = verts.map((_, i) => i);
  const tris = [];
  let guard = 0;
  while (idx.length > 3 && guard++ < n * n) {
    let found = false;
    for (let i = 0; i < idx.length; i++) {
      const ip = (i - 1 + idx.length) % idx.length;
      const inx = (i + 1) % idx.length;
      const a = verts[idx[ip]], b = verts[idx[i]], c = verts[idx[inx]];
      const cross = (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
      if (cross <= 0) continue;
      let ok = true;
      for (let j = 0; j < idx.length; j++) {
        if (j === ip || j === i || j === inx) continue;
        if (pointInTri(verts[idx[j]], a, b, c)) { ok = false; break; }
      }
      if (!ok) continue;
      tris.push(idx[ip], idx[i], idx[inx]);
      idx.splice(i, 1);
      found = true;
      break;
    }
    if (!found) break;
  }
  if (idx.length === 3) tris.push(idx[0], idx[1], idx[2]);
  return { verts, tris };
}

// ─────────────────────────────────────────────────────────────
// 2. PDF Operator List → 幾何批次
// ─────────────────────────────────────────────────────────────



function parseOperators(opList) {
  const fns = opList.fnArray;
  const args = opList.argsArray;
  const batches = [];
  const stats = { constructPath: 0, pathMatched: 0, fill: 0, stroke: 0, endPath: 0 };

  let ctm = [1, 0, 0, 1, 0, 0];
  const ctmStack = [];
  let fillColor = [0, 0, 0, 1];
  let strokeColor = [0, 0, 0, 1];
  let lineWidth = 1;

  // ★ 累積待繪製的路徑：constructPath 追加，fill/stroke 時輸出並清空
  let pendingPolys = [];

  const applyCTM = (x, y) => {
    const [a, b, c, d, e, f] = ctm;
    return [a * x + c * y + e, b * x + d * y + f];
  };
  const scaleLineWidth = w => {
    const [a, b, c, d] = ctm;
    return w * (Math.hypot(a, b) + Math.hypot(c, d)) / 2;
  };
  const toRGB = arr => (arr && arr.length >= 3 ? [arr[0], arr[1], arr[2]] : [0, 0, 0]);

  const emitFill = polys => {
    const verts = [], indices = [];
    const [r, g, b] = toRGB(fillColor);
    for (const poly of polys) {
      if (poly.length < 3) continue;
      const { verts: v, tris: t } = earClip(poly);
      const base = verts.length / 2;
      for (const [x, y] of v) verts.push(x, y);
      for (const ti of t) indices.push(base + ti);
    }
    if (indices.length) {
      batches.push({
        vertices: new Float32Array(verts),
        indices: new Uint32Array(indices),
        color: [r, g, b, 1],
      });
    }
  };

  const emitStroke = polys => {
    const verts = [], indices = [];
    const [r, g, b] = toRGB(strokeColor);
    const halfW = Math.max(scaleLineWidth(lineWidth) / 2, 0.05);
    const quad = (ax, ay, bx, by) => {
      const dx = bx - ax, dy = by - ay;
      const len = Math.hypot(dx, dy);
      if (len < 1e-9) return;
      const nx = -dy / len * halfW, ny = dx / len * halfW;
      const base = verts.length / 2;
      verts.push(ax + nx, ay + ny, bx + nx, by + ny, bx - nx, by - ny, ax - nx, ay - ny);
      indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
    };
    for (const poly of polys)
      for (let i = 0; i < poly.length - 1; i++)
        quad(poly[i][0], poly[i][1], poly[i + 1][0], poly[i + 1][1]);
    if (indices.length) {
      batches.push({
        vertices: new Float32Array(verts),
        indices: new Uint32Array(indices),
        color: [r, g, b, 1],
      });
    }
  };

  for (let i = 0; i < fns.length; i++) {
    const op = fns[i], a = args[i];
    switch (op) {
      case OPS.save:    ctmStack.push(ctm.slice()); break;
      case OPS.restore: if (ctmStack.length) ctm = ctmStack.pop(); break;

      case OPS.transform: {
        const [a2, b2, c2, d2, e2, f2] = a;
        const [a1, b1, c1, d1, e1, f1] = ctm;
        ctm = [
          a1*a2 + c1*b2, b1*a2 + d1*b2,
          a1*c2 + c1*d2, b1*c2 + d1*d2,
          a1*e2 + c1*f2 + e1, b1*e2 + d1*f2 + f1,
        ];
        break;
      }

      case OPS.setLineWidth:        lineWidth = a[0]; break;
      case OPS.setFillRGBColor:     fillColor = a; break;
      case OPS.setStrokeRGBColor:   strokeColor = a; break;
      case OPS.setFillGray:         fillColor = [a[0], a[0], a[0]]; break;
      case OPS.setStrokeGray:       strokeColor = [a[0], a[0], a[0]]; break;
      case OPS.setFillCMYKColor: {
        const [c, m, y, k] = a;
        fillColor = [(1-c)*(1-k), (1-m)*(1-k), (1-y)*(1-k)];
        break;
      }
      case OPS.setStrokeCMYKColor: {
        const [c, m, y, k] = a;
        strokeColor = [(1-c)*(1-k), (1-m)*(1-k), (1-y)*(1-k)];
        break;
      }

      // ── 只累積路徑，不繪製 ──
      case OPS.constructPath: {
        stats.constructPath++;
        if (!Array.isArray(a) || a.length < 2) break;
        let pathData, pathOps;
        const p0 = a[0], p1 = a[1];
        if (Array.isArray(p0) && Array.isArray(p1)) {
          if (p0.length <= p1.length) { pathOps = p0; pathData = p1; }
          else                        { pathData = p0; pathOps = p1; }
        } else break;

        let ai = 0;
        let poly = [];
        for (const po of pathOps) {
          switch (po) {
            case OPS.moveTo:
              if (poly.length > 1) pendingPolys.push(poly);
              poly = [];
              poly.push(applyCTM(pathData[ai++], pathData[ai++]));
              break;
            case OPS.lineTo:
              poly.push(applyCTM(pathData[ai++], pathData[ai++]));
              break;
            case OPS.curveTo: {
              const x1 = pathData[ai++], y1 = pathData[ai++];
              const x2 = pathData[ai++], y2 = pathData[ai++];
              const x3 = pathData[ai++], y3 = pathData[ai++];
              const last = poly.length ? poly[poly.length - 1] : [0, 0];
              flattenBezier(last, applyCTM(x1, y1), applyCTM(x2, y2), applyCTM(x3, y3), poly, 16);
              break;
            }
            case OPS.curveTo2: {
              const x2 = pathData[ai++], y2 = pathData[ai++];
              const x3 = pathData[ai++], y3 = pathData[ai++];
              const last = poly.length ? poly[poly.length - 1] : [0, 0];
              flattenBezier(last, last, applyCTM(x2, y2), applyCTM(x3, y3), poly, 16);
              break;
            }
            case OPS.curveTo3: {
              const x1 = pathData[ai++], y1 = pathData[ai++];
              const x3 = pathData[ai++], y3 = pathData[ai++];
              const last = poly.length ? poly[poly.length - 1] : [0, 0];
              const c1 = applyCTM(x1, y1), c3 = applyCTM(x3, y3);
              flattenBezier(last, c1, c3, c3, poly, 16);
              break;
            }
            case OPS.closePath:
              if (poly.length > 1) pendingPolys.push(poly);
              poly = [];
              break;
            case OPS.rectangle: {
              const x = pathData[ai++], y = pathData[ai++];
              const w = pathData[ai++], h = pathData[ai++];
              if (poly.length > 1) pendingPolys.push(poly);
              poly = [];
              pendingPolys.push([
                applyCTM(x, y),
                applyCTM(x + w, y),
                applyCTM(x + w, y + h),
                applyCTM(x, y + h),
              ]);
              break;
            }
          }
        }
        if (poly.length > 1) pendingPolys.push(poly);
        stats.pathMatched++;
        break;
      }

      // ★★★ 新增：獨立的 fill / stroke 操作 ★★★
      case OPS.fill:
      case OPS.eoFill:
      case OPS.stroke:
      case OPS.fillStroke:
      case OPS.eoFillStroke: {
        if (!pendingPolys.length) break;
        const doFill   = op === OPS.fill   || op === OPS.eoFill ||
                         op === OPS.fillStroke || op === OPS.eoFillStroke;
        const doStroke = op === OPS.stroke ||
                         op === OPS.fillStroke || op === OPS.eoFillStroke;
        if (doFill)   { emitFill(pendingPolys.map(p => p.slice()));   stats.fill++; }
        if (doStroke) { emitStroke(pendingPolys.map(p => p.slice())); stats.stroke++; }
        pendingPolys = [];
        break;
      }

      case OPS.endPath:
        stats.endPath++;
        pendingPolys = [];
        break;
    }
  }

  console.log('[parseOperators] 統計:', stats);
  return batches;
}

// ─────────────────────────────────────────────────────────────
// 3. WebGL 渲染後端（降級路徑）
// ─────────────────────────────────────────────────────────────

class WebGLBackend {
  constructor(canvas) {
    this.canvas = canvas;
    this.gl = canvas.getContext('webgl2', { antialias: true, premultipliedAlpha: false })
           || canvas.getContext('webgl',  { antialias: true, premultipliedAlpha: false });
    if (!this.gl) throw new Error('WebGL 不可用');
    if (!this.gl.getExtension('OES_element_index_uint') && this.gl instanceof WebGLRenderingContext) {
      throw new Error('缺少 OES_element_index_uint 擴展');
    }
    this._initShaders();
    this.vbo = this.gl.createBuffer();
    this.ibo = this.gl.createBuffer();
  }

  _initShaders() {
    const gl = this.gl;
    const vs = `attribute vec2 a_pos; uniform mat3 u_matrix;
      void main() { vec3 p = u_matrix * vec3(a_pos, 1.0); gl_Position = vec4(p.xy, 0.0, 1.0); }`;
    const fs = `precision mediump float; uniform vec4 u_color;
      void main() { gl_FragColor = u_color; }`;

    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error('Shader 錯誤: ' + gl.getShaderInfoLog(s));
      return s;
    };

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
      throw new Error('Program 連結失敗: ' + gl.getProgramInfoLog(prog));

    this.prog = prog;
    this.aPos = gl.getAttribLocation(prog, 'a_pos');
    this.uMatrix = gl.getUniformLocation(prog, 'u_matrix');
    this.uColor = gl.getUniformLocation(prog, 'u_color');
  }

  render(batches, matrix) {
    const gl = this.gl;
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    gl.clearColor(1, 1, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(this.prog);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    let tris = 0;
    for (const b of batches) {
      if (!b.vertices.length || !b.indices.length) continue;

      gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
      gl.bufferData(gl.ARRAY_BUFFER, b.vertices, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(this.aPos);
      gl.vertexAttribPointer(this.aPos, 2, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, b.indices, gl.DYNAMIC_DRAW);

      gl.uniformMatrix3fv(this.uMatrix, false, matrix);
      gl.uniform4fv(this.uColor, b.color);
      gl.drawElements(gl.TRIANGLES, b.indices.length, gl.UNSIGNED_INT, 0);
      tris += b.indices.length / 3;
    }
    return tris;
  }
}

// ─────────────────────────────────────────────────────────────
// 4. WebGPU 渲染後端（主路徑）
// ─────────────────────────────────────────────────────────────

class WebGPUBackend {
  constructor(canvas) { this.canvas = canvas; }

  async init() {
    if (!navigator.gpu) throw new Error('此瀏覽器不支援 WebGPU');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('找不到 WebGPU adapter');
    this.device = await adapter.requestDevice();

    this.ctx = this.canvas.getContext('webgpu');
    if (!this.ctx) throw new Error('無法取得 webgpu context');
    const format = navigator.gpu.getPreferredCanvasFormat();
    this.ctx.configure({ device: this.device, format, alphaMode: 'premultiplied' });

    const vs = `
      struct U { mvp: mat3x3<f32> };
      @group(0) @binding(0) var<uniform> u: U;
      @vertex fn vs(@location(0) pos: vec2<f32>) -> @builtin(position) vec4<f32> {
        let p = u.mvp * vec3<f32>(pos, 1.0);
        return vec4<f32>(p.xy, 0.0, 1.0);
      }`;
    const fs = `
      @group(1) @binding(0) var<uniform> color: vec4<f32>;
      @fragment fn fs() -> @location(0) vec4<f32> { return color; }`;

    const vsMod = this.device.createShaderModule({ code: vs });
    const fsMod = this.device.createShaderModule({ code: fs });

    this.pipeline = this.device.createRenderPipeline({
      layout: 'auto',
      vertex: {
        module: vsMod, entryPoint: 'vs',
        buffers: [{
          arrayStride: 8,
          attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x2' }],
        }],
      },
      fragment: {
        module: fsMod, entryPoint: 'fs',
        targets: [{
          format,
          blend: {
            color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
            alpha: { srcFactor: 'one',       dstFactor: 'one-minus-src-alpha', operation: 'add' },
          },
        }],
      },
      primitive: { topology: 'triangle-list' },
    });

    // mat3x3 在 uniform 位址空間中每列占 16 bytes → 總 48 bytes
    this.mvpBuffer = this.device.createBuffer({
      size: 48,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    this.mvpBindGroup = this.device.createBindGroup({
      layout: this.pipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: this.mvpBuffer } }],
    });
  }

  render(batches, matrix) {
    const mvp = new Float32Array(12);
    // column-major [m00,m10,m20,pad, m01,m11,m21,pad, m02,m12,m22,pad]
    mvp[0]=matrix[0]; mvp[1]=matrix[1]; mvp[2]=matrix[2];
    mvp[4]=matrix[3]; mvp[5]=matrix[4]; mvp[6]=matrix[5];
    mvp[8]=matrix[6]; mvp[9]=matrix[7]; mvp[10]=matrix[8];
    this.device.queue.writeBuffer(this.mvpBuffer, 0, mvp);

    const enc = this.device.createCommandEncoder();
    const view = this.ctx.getCurrentTexture().createView();
    const pass = enc.beginRenderPass({
      colorAttachments: [{
        view, loadOp: 'clear', storeOp: 'store',
        clearValue: { r: 1, g: 1, b: 1, a: 1 },
      }],
    });
    pass.setPipeline(this.pipeline);
    pass.setBindGroup(0, this.mvpBindGroup);

    let tris = 0;
    for (const b of batches) {
      if (!b.vertices.length || !b.indices.length) continue;

      const vb = this.device.createBuffer({
        size: b.vertices.byteLength,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
      });
      this.device.queue.writeBuffer(vb, 0, b.vertices);

      const ib = this.device.createBuffer({
        size: b.indices.byteLength,
        usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
      });
      this.device.queue.writeBuffer(ib, 0, b.indices);

      const cb = this.device.createBuffer({
        size: 16,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      this.device.queue.writeBuffer(cb, 0, new Float32Array(b.color));

      const cbg = this.device.createBindGroup({
        layout: this.pipeline.getBindGroupLayout(1),
        entries: [{ binding: 0, resource: { buffer: cb } }],
      });

      pass.setBindGroup(1, cbg);
      pass.setVertexBuffer(0, vb);
      pass.setIndexBuffer(ib, 'uint32');
      pass.drawIndexed(b.indices.length);
      tris += b.indices.length / 3;
    }
    pass.end();
    this.device.queue.submit([enc.finish()]);
    return tris;
  }
}

// ─────────────────────────────────────────────────────────────
// 5. 主應用
// ─────────────────────────────────────────────────────────────

class App {
  constructor() {
    this.canvas = document.getElementById('canvas');
    this.zoomLabel = document.getElementById('zoomLabel');
    this.statusEl = document.getElementById('status');
    this.statsEl = document.getElementById('stats');
    this.badgeEl = document.getElementById('backendBadge');

    this.pdfDoc = null;
    this.pageWidth = 0;
    this.pageHeight = 0;
    this.batches = [];
    this.backend = null;
    this.backendName = '';

    this.zoom = 1;
    this.panX = 0;
    this.panY = 0;
    this.dragging = false;
    this.lastMouse = null;
    this.hasPanned = false;

    this.textLayer = document.getElementById('textLayer');
    this.textContent = null;      // 由 PDF.js 取回的原始文字資料
    this.viewport = null;         // scale=1 的 viewport
    this._bindUI();
    this._bindCanvas();
    this._resizeCanvas();
    window.addEventListener('resize', () => { this._resizeCanvas(); this._render(); });
  }

  _log(msg) {
    const el = this.statusEl;
    const lines = el.textContent.split('\n');
    if (lines.length === 1 && lines[0] === '等待載入 PDF...') lines.length = 0;
    lines.push(msg);
    while (lines.length > 30) lines.shift();
    el.textContent = lines.join('\n');
    el.scrollTop = el.scrollHeight;
  }

  _bindUI() {
    document.getElementById('fileInput').addEventListener('change', e => {
      const f = e.target.files?.[0];
      if (f) this.loadPDF(f);
    });

    document.getElementById('zoomSlider').addEventListener('input', e => {
      this.zoom = parseFloat(e.target.value);
      this.hasPanned = false;   // 使用者主動改變縮放 → 重新置中
      this.zoomLabel.textContent = Math.round(this.zoom * 100) + '%';
      this._render();
    });

    document.getElementById('backendSelect').addEventListener('change', async e => {
      if (this.pdfDoc) await this._initBackend(e.target.value);
      this._render();
    });

    
    document.getElementById('resetBtn').addEventListener('click', () => {
      this.zoom = 1; this.panX = 0; this.panY = 0;
      document.getElementById('zoomSlider').value = 1;
      this.zoomLabel.textContent = '100%';
      this._render();
    });
  }

  
  _bindCanvas() {
    const c = this.canvas;
    c.addEventListener('mousedown', e => {
      this.dragging = true;
      this.lastMouse = { x: e.clientX, y: e.clientY };
      c.classList.add('dragging');
    });
    window.addEventListener('mousemove', e => {
      if (!this.dragging) return;
      const dx = e.clientX - this.lastMouse.x;
      const dy = e.clientY - this.lastMouse.y;
      this.lastMouse = { x: e.clientX, y: e.clientY };
      this.panX += dx;
      this.panY += dy;
      this._render();
    });
    window.addEventListener('mouseup', () => {
      this.dragging = false;
      c.classList.remove('dragging');
    });

    c.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      const z  = this.zoom;
      const z2 = Math.max(0.1, Math.min(64, z * factor));
      if (z2 === z) return;

      const rect = c.getBoundingClientRect();
      const dpr = this.dpr;
      const W = this.canvas.width, H = this.canvas.height;
      const pw = this.pageWidth, ph = this.pageHeight;
      const mx = (e.clientX - rect.left) * dpr;
      const my = (e.clientY - rect.top)  * dpr;

      // 求出游標下的 PDF 點
      const ox = W/2 + this.panX * dpr - pw * z  * dpr / 2;
      const oy = H/2 + this.panY * dpr - ph * z  * dpr / 2;
      const px = (mx - ox) / (z * dpr);
      const py = ph - (my - oy) / (z * dpr);

      // 反推新 pan，使 (px, py) 仍落在 (mx, my)
      const ox2 = mx - px * z2 * dpr;
      const oy2 = my - (ph - py) * z2 * dpr;
      this.panX = (ox2 - W/2 + pw * z2 * dpr / 2) / dpr;
      this.panY = (oy2 - H/2 + ph * z2 * dpr / 2) / dpr;
      this.zoom = z2;

      document.getElementById('zoomSlider').value = Math.min(64, z2);
      this.zoomLabel.textContent = Math.round(z2 * 100) + '%';
      this._render();
    }, { passive: false });
  }

  _resizeCanvas() {
    const rect = this.canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    this.canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    this.dpr = dpr;
  }

  async _initBackend(pref) {
    this.backend = null;
    this.backendName = '';
    this.badgeEl.className = 'badge init';
    this.badgeEl.textContent = '初始化中...';

    const tryGPU = pref === 'auto' || pref === 'webgpu';
    const tryGL  = pref === 'auto' || pref === 'webgl';

    if (tryGPU) {
      try {
        const gpu = new WebGPUBackend(this.canvas);
        await gpu.init();
        this.backend = gpu;
        this.backendName = 'WebGPU';
        this.badgeEl.className = 'badge gpu';
        this.badgeEl.textContent = 'WebGPU';
        this._log('✓ WebGPU 初始化成功');
        return;
      } catch (e) {
        this._log('✗ WebGPU 失敗: ' + e.message);
        if (pref === 'webgpu') {
          this.badgeEl.className = 'badge err';
          this.badgeEl.textContent = 'WebGPU 不可用';
          throw e;
        }
      }
    }

    if (tryGL) {
      try {
        const gl = new WebGLBackend(this.canvas);
        this.backend = gl;
        this.backendName = 'WebGL';
        this.badgeEl.className = 'badge gl';
        this.badgeEl.textContent = 'WebGL';
        this._log('✓ WebGL 初始化成功（降級路徑）');
        return;
      } catch (e) {
        this._log('✗ WebGL 失敗: ' + e.message);
        this.badgeEl.className = 'badge err';
        this.badgeEl.textContent = '無可用後端';
        throw e;
      }
    }
  }

  async loadPDF(file) {
    this._log('載入: ' + file.name);
    const buf = await file.arrayBuffer();
    this.pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    this._log('頁數: ' + this.pdfDoc.numPages);

    const page = await this.pdfDoc.getPage(1);
    const vp = page.getViewport({ scale: 1 });
    this.pageWidth = vp.width;
    this.pageHeight = vp.height;
    this._log(`頁面尺寸: ${this.pageWidth.toFixed(1)} × ${this.pageHeight.toFixed(1)} pt`);

    this._log('解析 operator list...');
    const opList = await page.getOperatorList();
    this._log(`運算子數量: ${opList.fnArray.length}`);

    const t0 = performance.now();
    this.batches = parseOperators(opList);
    this.viewport = page.getViewport({ scale: 1 });

    const t2 = performance.now();
    const textContent = await page.getTextContent();
    this.textContent = textContent;
    const t3 = performance.now();

    this._log(`文字項目數: ${textContent.items.length}`);
    this._log(`取文字耗時: ${(t3 - t2).toFixed(1)} ms`);

    this._buildTextLayer();
    const t1 = performance.now();

    let vTotal = 0, tTotal = 0;
    for (const b of this.batches) {
      vTotal += b.vertices.length / 2;
      tTotal += b.indices.length / 3;
    }
    this._log(`幾何批次: ${this.batches.length}`);
    this._log(`頂點總數: ${vTotal.toLocaleString()}`);
    this._log(`三角形總數: ${tTotal.toLocaleString()}`);
    this._log(`解析耗時: ${(t1 - t0).toFixed(1)} ms`);

    if (!this.backend) {
      await this._initBackend(document.getElementById('backendSelect').value);
    }
    this._render();
  }

  _computeMatrix() {
    const W = this.canvas.width, H = this.canvas.height;
    const dpr = this.dpr, z = this.zoom;
    const pw = this.pageWidth, ph = this.pageHeight;

    // 螢幕座標: screenX = ox + px*z*dpr ;  screenY = oy + (ph - py)*z*dpr
    // NDC:      ndcX = 2*screenX/W - 1 ;  ndcY = 1 - 2*screenY/H
    const a = 2 * z * dpr / W;
    const e = 2 * z * dpr / H;
    const c = 2 * this.panX * dpr / W - pw * z * dpr / W;
    const f = -2 * this.panY * dpr / H - ph * z * dpr / H;

    // column-major mat3: [col0, col1, col2]
    return new Float32Array([a, 0, 0, 0, e, 0, c, f, 1]);
  }
  _buildTextLayer() {
    this.textLayer.innerHTML = '';
    if (!this.textContent || !this.viewport) return;

    const ph = this.pageHeight;
    const frag = document.createDocumentFragment();

    // PDF.js 合併 viewport 與 item 變換，直接得到「左上原點、y 向下」的座標
    const Util = pdfjsLib.Util;

    for (const item of this.textContent.items) {
      const str = item.str;
      if (!str || !str.trim()) continue;

      // tx = viewport.transform × item.transform
      // 結果：[a, b, c, d, e, f]，(e, f) 為基線在螢幕空間的位置（y 向下）
      const tx = Util.transform(this.viewport.transform, item.transform);
      const fontHeight = Math.hypot(tx[2], tx[3]);
      if (fontHeight < 0.5) continue;

      const span = document.createElement('span');
      span.textContent = str;
      // 相對基線的水平位置
      span.style.left = tx[4] + 'px';
      // 基線 → 字形頂部：以 0.8 × fontSize 估計 ascent
      span.style.top  = (tx[5] - fontHeight * 0.8) + 'px';
      span.style.fontSize = fontHeight + 'px';

      // 旋轉（傾斜或直排文字）
      const angle = Math.atan2(tx[1], tx[0]);
      if (Math.abs(angle) > 0.001) {
        span.style.transform = `rotate(${angle}rad)`;
      }

      // 依 fontName 做粗體/斜體推斷（PDF.js 提供通用名稱）
      // 進階可對應 styleMap，本階段先略過

      frag.appendChild(span);
    }

    this.textLayer.appendChild(frag);
    this._updateTextLayerTransform();
  }

  _updateTextLayerTransform() {
    if (!this.textLayer) return;
    const rect = this.canvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;    // CSS 像素
    const z = this.zoom;
    const pw = this.pageWidth, ph = this.pageHeight;

    // 與 WebGL 完全相同的頁面左上角在螢幕中的位置（CSS px）
    const ox = W / 2 + this.panX - pw * z / 2;
    const oy = H / 2 + this.panY - ph * z / 2;

    // 容器 transform：平移 + 縮放（span 座標為 pt，即 z=1 時的 px）
    this.textLayer.style.transform =
      `translate(${ox}px, ${oy}px) scale(${z})`;
  }
  _render() {
    if (!this.backend || !this.batches.length) return;
    const matrix = this._computeMatrix();
    const t0 = performance.now();
    const tris = this.backend.render(this.batches, matrix);
    const t1 = performance.now();

    this._updateTextLayerTransform();   // ★ 新增：文字層跟著縮放/平移

    this.statsEl.textContent =
      `後端:       ${this.backendName}\n` +
      `縮放:       ${(this.zoom * 100).toFixed(0)}%\n` +
      `批次:       ${this.batches.length}\n` +
      `三角形:     ${tris.toLocaleString()}\n` +
      `文字項目:   ${this.textContent ? this.textContent.items.length : 0}\n` +
      `渲染耗時:   ${(t1 - t0).toFixed(2)} ms\n` +
      `Canvas:     ${this.canvas.width}×${this.canvas.height}\n` +
      `DPR:        ${this.dpr}`;
  }
}

new App();
</script>
